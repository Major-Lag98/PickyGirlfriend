<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Roulette</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { position: relative; width: 90vw; max-width: 500px; margin-top: 50px; }
        canvas { width: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); background: white; }
        #spin-btn { margin-top: 30px; padding: 15px 40px; font-size: 1.5rem; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 50px; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); transition: transform 0.1s; }
        #spin-btn:active { transform: scale(0.95); }
        #result { margin-top: 20px; font-size: 1.8rem; font-weight: bold; color: #2f3542; min-height: 2rem; }
        .arrow { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 30px solid #2f3542; z-index: 10; }
        #landing { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; min-height: 90vh; }
        .mode-btn { width: 260px; padding: 18px 40px; font-size: 1.5rem; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 50px; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); transition: transform 0.1s; }
        .mode-btn:active { transform: scale(0.95); }
        #wheel-view { display: none; flex-direction: row; justify-content: center; align-items: flex-start; gap: 40px; width: 100%; }
        .wheel-main { display: flex; flex-direction: column; align-items: center; }
        #filters { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px 24px; margin-top: 50px; min-width: 160px; }
        #filters h2 { margin: 20px 0 12px; font-size: 1.1rem; color: #2f3542; }
        #filters h2:first-child { margin-top: 0; }
        #filters label { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 1.1rem; color: #2f3542; cursor: pointer; text-transform: capitalize; }
        #filters input { width: 18px; height: 18px; cursor: pointer; accent-color: #ff4757; }
    </style>
</head>
<body>

    <div id="landing">
        <button class="mode-btn" data-mode="home-cook">Home Cook</button>
        <button class="mode-btn" data-mode="take-out">Take Out</button>
        <button class="mode-btn" data-mode="eat-in">Eat In</button>
    </div>

    <div id="wheel-view">
        <div id="filters">
            <h2>Categories</h2>
            <div id="category-list"></div>
            <h2>Type</h2>
            <div id="type-list">
                <label><input type="radio" name="food-type" value="any" checked>Any</label>
                <label><input type="radio" name="food-type" value="fast-food">Fast food</label>
                <label><input type="radio" name="food-type" value="sit-down">Take-out</label>
            </div>
        </div>
        <div class="wheel-main">
            <h1>Where should we eat?</h1>
            <div class="container">
                <div class="arrow"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
            </div>
            <button id="spin-btn">SPIN THE WHEEL!</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const resultDiv = document.getElementById('result');

        let allRestaurants = [];   // full list of { name, tags }
        let restaurants = [];      // names currently on the wheel (after filtering)
        let currentRotation = 0;
        let isSpinning = false;

        // 1. Fetch and Parse JSON
        async function loadRestaurants() {
            try {
                const response = await fetch('restaurants.json');
                allRestaurants = await response.json();
                buildCategoryFilters();
                applyFilters();
            } catch (err) {
                resultDiv.innerText = "Error loading restaurants.json!";
            }
        }

        // "fast-food" is its own axis (the Type radios), not a cuisine checkbox
        const TYPE_TAG = 'fast-food';

        // Build one checkbox per unique cuisine tag, derived from the data
        function buildCategoryFilters() {
            const categories = [...new Set(allRestaurants.flatMap(r => r.tags))]
                .filter(t => t !== TYPE_TAG)
                .sort();
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            categories.forEach(cat => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = cat;
                cb.addEventListener('change', applyFilters);
                label.appendChild(cb);
                label.appendChild(document.createTextNode(cat));
                list.appendChild(label);
            });
            document.querySelectorAll('#type-list input').forEach(r => r.addEventListener('change', applyFilters));
        }

        // Rebuild the wheel: cuisine checkboxes (OR/union; none = all) AND the Type radio
        function applyFilters() {
            const checked = [...document.querySelectorAll('#category-list input:checked')].map(cb => cb.value);
            const type = document.querySelector('#type-list input:checked').value;
            const matches = allRestaurants.filter(r => {
                const cuisineOk = checked.length === 0 || r.tags.some(t => checked.includes(t));
                const isFastFood = r.tags.includes(TYPE_TAG);
                const typeOk = type === 'any'
                    || (type === 'fast-food' && isFastFood)
                    || (type === 'sit-down' && !isFastFood);
                return cuisineOk && typeOk;
            });
            restaurants = matches.map(r => r.name);
            currentRotation = 0;
            resultDiv.innerText = '';
            drawWheel();
        }

        // 2. Draw the Wheel
        function drawWheel() {
            const numSegments = restaurants.length;
            const arc = (2 * Math.PI) / numSegments;
            ctx.clearRect(0, 0, 500, 500);

            restaurants.forEach((name, i) => {
                const angle = i * arc + currentRotation;
                ctx.beginPath();
                ctx.fillStyle = `hsl(${(i * 360) / numSegments}, 70%, 60%)`;
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 250, angle, angle + arc);
                ctx.fill();
                ctx.stroke();

                // Add Text
                ctx.save();
                ctx.translate(250, 250);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 18px Arial";
                ctx.fillText(name, 230, 10);
                ctx.restore();
            });
        }

        // 3. Spin Logic
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            if (restaurants.length === 0) {
                resultDiv.innerText = "No spots match — adjust the filters!";
                return;
            }
            isSpinning = true;
            resultDiv.innerText = "Spinning...";

            const extraSpins = 5 + Math.random() * 5; // Rotate 5-10 times
            const targetRotation = currentRotation + (extraSpins * Math.PI * 2);
            const startTime = performance.now();
            const duration = 4000; // 4 seconds

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out cubic function for smooth stop
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = targetRotation * easeOut;

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    determineWinner();
                }
            }
            requestAnimationFrame(animate);
        });

        function determineWinner() {
            const numSegments = restaurants.length;
            const arc = (2 * Math.PI) / numSegments;
            
            // Normalize rotation to 0-2PI
            let normalizedRotation = currentRotation % (Math.PI * 2);
            
            // Arrow points upward at 3π/2 (in canvas coordinates where Y increases downward)
            // Find which segment contains the arrow angle
            let diff = (3 * Math.PI / 2 - normalizedRotation + Math.PI * 2) % (Math.PI * 2);
            const index = Math.floor(diff / arc) % numSegments;
            
            // index + 1 because 
            resultDiv.innerText = `You should eat at: ${restaurants[index]}!`;
        }

        // Landing screen: each mode button reveals the wheel (all identical for now)
        const landing = document.getElementById('landing');
        const wheelView = document.getElementById('wheel-view');
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                landing.style.display = 'none';
                wheelView.style.display = 'flex';
            });
        });

        loadRestaurants();
    </script>
</body>
</html>
